<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WayPoint — You're Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0e;
      --fg: #f0f0f5;
      --muted: rgba(255,255,255,0.4);
      --primary: #6366f1;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 1rem;
      display: grid;
      place-items: center;
      margin: 0 auto 1.5rem;
      font-size: 1.75rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.4rem 0.9rem;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 2s infinite;
    }

    .dot.online { background: #22c55e; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🧭</div>
    <h1>You're Offline</h1>
    <p>WayPoint needs a connection to load. Head somewhere with signal and we'll pick up right where you left off.</p>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">No connection</span>
    </div>
    <p class="hint">Page will reload automatically when you reconnect.</p>
  </div>

  <script>
    async function updateStatus() {
      const dot = document.getElementById('dot');
      const text = document.getElementById('status-text');
      
      if (navigator.onLine) {
        // Just because the computer is online doesn't mean our specific server is up.
        // Let's ping the server to make sure it's actually reachable before reloading!
        try {
          const response = await fetch(window.location.href, { method: 'HEAD' });
          if (response.ok) {
            dot.classList.add('online');
            text.textContent = 'Back online — reloading…';
            setTimeout(() => location.reload(), 800);
            return;
          }
        } catch (e) {
          // Server is still unreachable
        }
        
        // Computer is online, but server is down
        dot.classList.remove('online');
        text.textContent = 'Server is unreachable';
      } else {
        dot.classList.remove('online');
        text.textContent = 'No connection';
      }
    }

    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    
    // Initial check
    updateStatus();
    
    // Periodically check if the server is back while we are online
    setInterval(() => {
      if (navigator.onLine) updateStatus();
    }, 5000);
  </script>
</body>
</html>
